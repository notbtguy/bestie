name: Unpack source
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bestie source zip into the repo
        run: |
          Z=$(ls *bestie-src.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "nothing to unpack"; exit 0; fi
          unzip -o "$Z"
          rm -f ./*bestie-src.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Bestie source"
          git push
