name: Unpack source
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack 1-bestie-src.zip into the repo
        run: |
          if [ ! -f 1-bestie-src.zip ]; then echo "nothing to unpack"; exit 0; fi
          unzip -o 1-bestie-src.zip
          rm 1-bestie-src.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Bestie source"
          git push
